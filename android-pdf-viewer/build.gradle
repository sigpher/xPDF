plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.github.barteksc.pdfviewer'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "3.2.0-beta.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // pdfium 原生绑定（com.shockwave.pdfium）。JCenter 已停服，坐标由阿里云镜像兜底解析；
    // 该库本身不引用 support 库，按其传递依赖显式排除，避免 support-v4 回流。
    api('com.github.barteksc:pdfium-android:1.9.0') {
        exclude group: 'com.android.support'
    }
    // 本模块不依赖 sigpher/Base，避免把图片加载等无关依赖带给使用方
    implementation 'androidx.core:core-ktx:1.13.1'
    // AboutUtils 使用了其中的 StringUtils / PathUtils
    implementation 'com.blankj:utilcodex:1.23.7'
    // PDFView 用 MutableLiveData 暴露当前缩放比例；原先由 sigpher/Base 传递带入
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
}
repositories {
    mavenCentral()
}
