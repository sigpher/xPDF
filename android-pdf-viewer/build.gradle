plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.github.barteksc.pdfviewer'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "3.2.0-beta.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // pdfium 原生绑定（com.shockwave.pdfium）。JCenter 已停服，坐标由阿里云镜像兜底解析；
    // 该库本身不引用 support 库，按其传递依赖显式排除，避免 support-v4 回流。
    api('com.github.barteksc:pdfium-android:1.9.0') {
        exclude group: 'com.android.support'
    }
    // 基础库改用 sigpher/Base fork（原 com.aaron:base 依赖的 JCenter 已停服）
    implementation 'com.github.sigpher:Base:1.1.5-beta9'
    implementation 'androidx.core:core-ktx:1.13.1'
}
repositories {
    mavenCentral()
}
