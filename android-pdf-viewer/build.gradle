plugins {
    // AGP 9 起内置 Kotlin 支持，无需再应用 org.jetbrains.kotlin.android
    id 'com.android.library'
}

android {
    namespace 'com.github.barteksc.pdfviewer'
    compileSdk 37

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "3.2.0-beta.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

// Gradle 守护进程在 JDK 17 上运行，这里用 toolchain 让 javac 使用 JDK 21+（读得懂 pdfium 绑定的 major 65 字节码）
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

dependencies {
    // pdfium 原生绑定：改用持续维护的 PdfiumAndroidKt（2.x 为 Kotlin 重写版，原生库随 NDK 构建）
    api 'io.legere:pdfiumandroid:2.0.3'
    // 本模块不依赖 sigpher/Base，避免把图片加载等无关依赖带给使用方
    implementation 'androidx.core:core-ktx:1.13.1'
    // AboutUtils 使用了其中的 StringUtils / PathUtils
    implementation 'com.blankj:utilcodex:1.23.7'
    // PDFView 用 MutableLiveData 暴露当前缩放比例；原先由 sigpher/Base 传递带入
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
}
repositories {
    mavenCentral()
}
