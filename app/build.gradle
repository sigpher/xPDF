plugins {
    // AGP 9 起内置 Kotlin 支持，无需再应用 org.jetbrains.kotlin.android
    id 'com.android.application'
}

android {
    namespace 'com.sigpher.xpdf'
    compileSdk 37

    resourcePrefix 'app'

    defaultConfig {
        applicationId "com.sigpher.xpdf"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "0.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // minSdk 24 起系统原生支持 multidex，无需显式开启/引入 androidx.multidex
        // 只保留中英文资源，裁掉三方库带入的其他语言，缩小 resources.arsc
        // 注意：裁剪按 qualifier 精确匹配，只写 'zh' 匹配不到 values-zh-rCN 等目录，
        // 会把中文资源整包裁掉（APK 内只剩 en）。这里与 res/values-zh-* 目录一一对应。
        resourceConfigurations += ['en', 'zh-rCN', 'zh-rTW', 'zh-rHK', 'zh-rMO', 'zh-rSG']

        ndk {
            // 仅保留 arm64-v8a，减小包体
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // local.properties 不存在或未配置签名时，退回 debug 签名，保证 clone 后可直接 sync
        Properties properties = new Properties()
        File localProps = project.rootProject.file('local.properties')
        if (localProps.exists()) {
            localProps.withInputStream { properties.load(it) }
        }
        release {
            if (properties.getProperty("STORE_FILE_NAME") != null) {
                storeFile file(properties.getProperty("STORE_FILE_NAME"))
                storePassword properties.getProperty("KEYSTORE_PASSWORD")
                keyAlias properties.getProperty("STORE_ALIAS")
                keyPassword properties.getProperty("KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            manifestPlaceholders = [
                    app_icon : '@mipmap/app_ic_launcher',
                    app_name : '@string/app_name_en'
            ]
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix '.dev'
            manifestPlaceholders = [
                    app_icon : '@mipmap/app_ic_launcher_dev',
                    app_name : '@string/app_name_dev'
            ]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }



    // AGP 8 起 packagingOptions 已废弃，统一改用 packaging
    packaging {
        // AGP 9 默认把 .so 原样存入 APK（不压缩），下载包会变大；
        // 这里保持与历史版本一致的行为：压缩后再由安装器解压。
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

// Gradle 守护进程在 JDK 17 上运行，这里用 toolchain 让 javac 使用 JDK 21+（读得懂 pdfium 绑定的 major 65 字节码）
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // 仅使用 TabLayout；其布局资源仍引用 ConstraintLayout 属性，故不能排除该传递依赖
    implementation 'com.google.android.material:material:1.11.0'
    // 仅需要 ViewPager（原 legacy-support-v4 已无用）
    implementation 'androidx.viewpager:viewpager:1.0.0'
    // SAF 目录树导入需要遍历 DocumentFile
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation project(':android-pdf-viewer')
    // 原先由 Base AAR 传递提供的两个库，移除该依赖后改为显式声明
    // Glide：封面加载，版本与 Base 内部一致，不升级大版本
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    // AndroidUtilCode：StringUtils / TimeUtils / ToastUtils / SPStaticUtils 等通用工具类
    implementation 'com.blankj:utilcodex:1.23.7'
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'com.github.anzewei:parallaxbacklayout:1.1.9'
    // 收藏夹重命名界面的模糊背景（app_fragment_collection.xml 中的 RealtimeBlurView）
    implementation 'com.github.mmin18:realtimeblurview:1.2.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.github.bmelnychuk:atv:1.2.9'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    implementation "androidx.core:core-ktx:1.13.1"
    // coroutines-android 已传递提供 kotlinx-coroutines-core，无需重复声明
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.46'
}
