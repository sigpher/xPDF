plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sigpher.xpdf'
    compileSdk 34

    resourcePrefix 'app'

    defaultConfig {
        applicationId "com.sigpher.xpdf"
        minSdk 21
        targetSdk 34
        versionCode 33
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        // 只保留中英文资源，裁掉三方库带入的其他语言，缩小 resources.arsc
        resourceConfigurations += ['en', 'zh']

        ndk {
            // 仅保留 arm64-v8a，减小包体
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // local.properties 不存在或未配置签名时，退回 debug 签名，保证 clone 后可直接 sync
        Properties properties = new Properties()
        File localProps = project.rootProject.file('local.properties')
        if (localProps.exists()) {
            localProps.withInputStream { properties.load(it) }
        }
        release {
            if (properties.getProperty("STORE_FILE_NAME") != null) {
                storeFile file(properties.getProperty("STORE_FILE_NAME"))
                storePassword properties.getProperty("KEYSTORE_PASSWORD")
                keyAlias properties.getProperty("STORE_ALIAS")
                keyPassword properties.getProperty("KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            manifestPlaceholders = [
                    app_icon : '@drawable/app_ic_xpdf',
                    app_name : '@string/app_name_en'
            ]
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix '.dev'
            manifestPlaceholders = [
                    app_icon : '@drawable/app_ic_xpdf_dev',
                    app_name : '@string/app_name_dev'
            ]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }



    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    // 仅需要 ViewPager（原 legacy-support-v4 已无用）
    implementation 'androidx.viewpager:viewpager:1.0.0'
    // SAF 目录树导入需要遍历 DocumentFile
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation project(':android-pdf-viewer')
    // 基础库：原 com.aaron:base 已停止维护（JCenter 已停服），改用 sigpher/Base fork，经 JitPack 发布
    implementation 'com.github.sigpher:Base:1.1.5-beta9'
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'com.github.anzewei:parallaxbacklayout:1.1.9'
    implementation 'com.github.mmin18:realtimeblurview:1.2.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.github.bmelnychuk:atv:1.2.9'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.46'
}
repositories {
    mavenCentral()
}
